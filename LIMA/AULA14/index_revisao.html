<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Revisão HTML - Conceitos Flex e Grid</title>
</head>
<body>
    <section class="titulo-secao">
        <header class="titulo">
            <a href="#logo"><h1><span>RETRO</span>GAME</h1></a>

            <h3>Com grandes poderes, vem grandes responsabilidades</h3>

            <nav>
                <ul class="nav">
                  <a href="#Inicio">Inicio</a>
                  <a href="#Sobre">Sobre</a>
                </ul>     
            </nav>
        </header>
    </section>

    <main>
        <section class="conteudo">
            <article class="conteudo-art">
                <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Qui accusantium inventore, iure ratione itaque animi, velit eos ea nisi optio ipsum possimus rem dolorum totam est nobis voluptatum, modi a!</p>
            </article>

            <figure class="conteudo-img">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQtXUUASzYw6dpC8L6H6EphLgGifpawVFErKSvsIfrDVQ&s=10" alt="imagem 1 - Ilustrativa">
                <figcaption>
                    Legenda de imagem gerada por IA
                </figcaption>

            </figure>
        </section>

        <section class="galeria">
            <ul class="galeria-img">
                <figure>
                    <li>Imagem 2 - Ilustrativa</li>
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRn5U9xLF1KlPeLk7uyX91O_mWxjw4HMfddeZj1h5hxkg&s=10" alt="Imagem Gerada por IA">
                </figure>
               
                <figure>
                    <li>Imagem 3 - Ilustrativa</li>
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRG7esYY0IwKhblSfu1Vd1jbCuA-BjqtbRIEqKl4KED3cwjRDw1LNVBZ2o&s=10" alt="Imagem Gerada por IA">
                </figure>

                <figure>
                    <li>Imagem 4 - Ilustrativa</li>
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR-0MIu1kWFJqGs4YVuOYJ_3D7O0IBsB87Pgc4Z3PAy5A&s=10" alt="Imagem Gerada por IA">
                </figure>
            </ul>
        </section>

        <section class="imagem">
            <figure class="imagem-img">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSbhqMG25DoRrmPo6y8oWbs98weNK4N1m454QPJiAn7gQ&s=10" alt="Imagem Ilustrativa 5">
            </figure>
        </section>

        <section class="cartoes">
            <figure class="cartoes-img">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSzTCBV98DGBhNDnRrh4UiT2P8j3-muo7CMi7pBwmLZAw&s=10" alt="Imagem Ilustrativa 6">
                <aside class="cartoes-corpo">
                    <h3>Imagem Ilustrativa 6</h3>
                    <p>Uma aventura em 1 dia</p>
                </aside>
            </figure>
        </section>
        
        <section class="final">
            <figure class="imagem-final">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRophRRqVyFOmjmX4VfAj_22o-p7hqx1pKDMR-50qiYDg&s=10" alt="Imagem Ilustrativa Final">
                <figcaption>
                    <strong>Imagem em Destaque</strong>
                    <small>Foto por Matheus Oricolli</small>
                </figcaption>
            </figure>
        </section>

    </main>
</body>
</html>
