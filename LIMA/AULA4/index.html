<!DOCTYPE html>
<html lang="pt - BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="favicon.png" type="image/x-icon">
    <title>FAVICONS e IMAGENS </title>
</head>
<body>
    <div>
        <h1>Imagens do Google</h1>
    </div>
    <div>
          <h2>Punk-Spider</h2>

    <!-- Tag para acrescentar imagens -->
    <img src="imagem_homem_aranha.jpg" alt="Punk-Spider from Spider-man: Into the Spider-Verse" title="Punk-Spider from Spider-man: Into the Spider-Verse" align="left">
    </div>
  
  <div>
       <h2 align="right">Punk-Spider - Com proporção de imagens</h2>  

    <img src="imagem_homem_aranha.jpg" 
    alt="Punk-Spider from Spider-man: Into the Spider-Verse"
    title="Punk-Spider from Spider-man: Into the Spider-Verse"
    width="600px"
    height="400px"
    align="right"
    >
  </div>
    <h2>"Punk-Spider from Spider-man: Into the Spider-Verse"</h2>
    <div>
        <img src="imagem_homem_aranha.jpg" 
        alt="Punk-Spider from Spider-man: Into the Spider-Verse"
        title="Punk-Spider from Spider-man: Into the Spider-Verse"
        style=
        "margin: 20px;
        background-image: url(imagem_homem_aranha.jpg);
        background-size: 20px;
        background-image: none;
        background-repeat: repeat;">
    </div>

</body>
</html>
